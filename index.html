<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المجالس العاشورية في المآتم الحسينية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Gulzar&family=Noto+Nastaliq+Urdu&family=Noto+Naskh+Arabic&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #faf8f2;
      color: #1a1a1a;
      font-family: 'Amiri', 'Noto Naskh Arabic', serif;
    }

    .card {
      text-align: center;
      padding: 3em 2em 2.5em;
      max-width: 680px;
      width: 100%;
    }

    .ornament {
      font-size: 2em;
      color: #8b1a1a;
      letter-spacing: 0.2em;
      margin-bottom: 0.6em;
    }

    .title-ar {
      font-family: 'Amiri', 'Noto Naskh Arabic', serif;
      font-size: 2em;
      line-height: 1.5;
      direction: rtl;
      color: #1a1a1a;
      margin: 0 0 0.15em;
    }

    .title-ur {
      font-family: 'Gulzar', 'Noto Nastaliq Urdu', serif;
      font-size: 1.3em;
      line-height: 2;
      direction: rtl;
      color: #444;
      margin: 0 0 0.15em;
    }

    .title-en {
      font-family: 'Georgia', serif;
      font-size: 1em;
      font-style: italic;
      color: #666;
      margin: 0 0 1.6em;
    }

    .divider {
      border: none;
      border-top: 1px solid #c8b89a;
      width: 60%;
      margin: 0 auto 1.4em;
    }

    .author-ar {
      font-family: 'Noto Naskh Arabic', serif;
      font-size: 0.95em;
      direction: rtl;
      color: #555;
      margin: 0 0 0.2em;
    }

    .author-ur {
      font-family: 'Gulzar', 'Noto Nastaliq Urdu', serif;
      font-size: 0.9em;
      line-height: 2;
      direction: rtl;
      color: #666;
      margin: 0 0 0.2em;
    }

    .author-en {
      font-family: 'Georgia', serif;
      font-size: 0.85em;
      color: #777;
      margin: 0 0 2.2em;
    }

    .buttons {
      display: flex;
      gap: 1.2em;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 0.7em 2.2em;
      border: 1.5px solid #8b1a1a;
      border-radius: 3px;
      text-decoration: none;
      font-size: 1em;
      color: #8b1a1a;
      background: transparent;
      transition: background 0.18s, color 0.18s;
      letter-spacing: 0.03em;
    }

    .btn:hover {
      background: #8b1a1a;
      color: #fff;
    }

    .btn-ur {
      font-family: 'Gulzar', 'Noto Nastaliq Urdu', serif;
      font-size: 1.15em;
      line-height: 1.8;
      direction: rtl;
    }

    .btn-en {
      font-family: 'Georgia', serif;
      font-style: italic;
    }

    @media (max-width: 480px) {
      .title-ar { font-size: 1.5em; }
      .card { padding: 2em 1.2em 2em; }
      .buttons { flex-direction: column; align-items: center; }
      .btn { width: 80%; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="ornament">﷽</div>

    <h1 class="title-ar">المجالس العاشورية في المآتم الحسينية</h1>
    <p class="title-ur">حسینی مجالسِ عزا میں عاشورا کی محفلیں</p>
    <p class="title-en">The ʿĀshūrāʾ Gatherings in the Ḥusaynī Mourning Assemblies</p>

    <hr class="divider">

    <p class="author-ar">تأليف: الشيخ عبدالله ابن الحاج حسن آل درويش</p>
    <p class="author-ur">تصنیف: شیخ عبداللہ بن الحاج حسن الدرویش</p>
    <p class="author-en">Sheikh Abdullah ibn Al-Hajj Hasan Al-Darwish</p>

    <div class="buttons">
      <a class="btn btn-ur" href="urdu/index.html">اردو</a>
      <a class="btn btn-en" href="english/index.html">English</a>
    </div>
  </div>
</body>
</html>
